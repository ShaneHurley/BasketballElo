[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "basketballelo"
version = "0.2.0"
description = "Leak-aware NBA spread prediction pipeline (player Glicko-2, walk-forward meta models, formal leak registry)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Shane Hurley" }]
keywords = ["nba", "elo", "glicko", "sports-analytics", "calibration", "walk-forward"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "pandas>=2.0",
  "numpy>=1.24",
  "scikit-learn>=1.3",
  "optuna>=3.0",
  "catboost>=1.2",
  "tqdm>=4.65",
  "matplotlib>=3.7",
  "scipy>=1.10",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
  "pytest-cov>=4.1",
  "ruff>=0.5",
  "mypy>=1.8",
  "pre-commit>=3.6",
]
docs = [
  "mkdocs>=1.5",
  "mkdocs-material>=9.5",
  "mkdocstrings[python]>=0.24",
  "pymdown-extensions>=10.7",
]
dashboard = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "sse-starlette>=1.8",
]
extra = [
  "requests>=2.28",
  "xgboost>=1.7",
  "lightgbm>=4.0",
  "nba_api>=1.4",
]

[project.urls]
Homepage = "https://github.com/ShaneHurley/BasketballElo"
Documentation = "https://shanehurley.github.io/BasketballElo/"
Repository = "https://github.com/ShaneHurley/BasketballElo"
Issues = "https://github.com/ShaneHurley/BasketballElo/issues"

[tool.setuptools.packages.find]
where = ["code"]
include = ["pipeline*", "dashboard*"]

[tool.pytest.ini_options]
testpaths = ["code/tests"]
pythonpath = ["code"]
addopts = "-q"
filterwarnings = [
  "ignore::DeprecationWarning",
  "ignore::FutureWarning",
]

[tool.ruff]
target-version = "py39"
line-length = 110
src = ["code"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.9"
ignore_missing_imports = true
warn_unused_ignores = true
pretty = true
packages = ["pipeline"]
mypy_path = "code"

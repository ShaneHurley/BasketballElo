name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11"]

    defaults:
      run:
        working-directory: code

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-pipeline.txt
          pip install -r ../requirements-dev.txt

      - name: Ruff
        run: |
          ruff check pipeline tests --output-format=github || true
          # Non-blocking on first CI land: prefer green pytest while style debt is paid down.
          # Fail-hard once the tree is clean: remove `|| true` above.

      - name: Pytest (leak + smoke + integrity core)
        run: |
          python -m pytest \
            tests/test_smoke.py \
            tests/test_leak_registry.py \
            tests/test_manual_oof_stacker.py \
            tests/test_calibration_slice_registry.py \
            tests/test_devig.py \
            tests/test_pythagorean_devig.py \
            tests/test_dates.py \
            tests/test_cv_past_only.py \
            tests/test_epm_priors_versioning.py \
            tests/test_confidence_gates.py \
            -q --tb=short

      - name: Pytest (formula bench — Epic 10)
        # Separate budget from leak/smoke. Path-scoped so collection does not
        # pull unrelated modules. xfail(strict) tracks known P0 bugs;
        # unexpected passes fail CI so fixed bugs cannot keep a stale xfail.
        run: |
          python -m pytest \
            tests/test_bench_factories.py \
            tests/test_bench_p0_kelly.py \
            tests/test_bench_p0_venn_abers.py \
            -m bench -q --tb=short

site_name: BasketballElo
site_description: Leak-aware NBA spread prediction — walk-forward pipeline, formal leak registry, Glicko-2 ratings.
site_url: https://shanehurley.github.io/BasketballElo/
repo_url: https://github.com/ShaneHurley/BasketballElo
repo_name: ShaneHurley/BasketballElo
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - scheme: slate
      primary: black
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: white
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - toc.follow
  font: false
  icon:
    repo: fontawesome/brands/github

extra_css:
  - stylesheets/carbon.css

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [code]
          options:
            docstring_style: google
            show_source: true
            members_order: source
            show_root_heading: true
            heading_level: 2

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - History: history.md
  - Pipeline: pipeline.md
  - Leak Registry: leaks.md
  - Dashboard: dashboard.md
  - Math:
      - Elo → PPP: math/elo.md
      - Glicko-2 ratings: math/glicko2.md
      - Calibration: math/calibration.md
      - De-vig: math/devig.md
      - Staking: math/staking.md
  - API:
      - Overview: api/index.md
      - Ratings: api/ratings.md
      - OOF / CV: api/oof.md
      - Devig: api/devig.md
      - Calibration registry: api/calibration_registry.md
  - Roadmap: roadmap.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ShaneHurley/BasketballElo
